<section class="ph">
  <div class="wrap">
    <p class="eb">{{category}}</p>
    <h1>{{title}}</h1>
    <p class="lead">{{date}} · {{time}} · {{location}}</p>
  </div>
</section>
<section>
  <div class="wrap two-col">
    <div class="rv">
      <a class="lk back" href="events.html">← All events</a>
      <h2>About this event</h2>
      <p>{{description}}</p>
      <h3>Speakers</h3>
      {{speakers}}
      <h3>Agenda</h3>
      <table><tr><th>Time</th><th>Session</th></tr>{{agenda}}</table>
    </div>
    <aside class="card rv">
      <h3>Details</h3>
      <p><b>Date</b><br>{{date}}</p>
      <p><b>Time</b><br>{{time}}</p>
      <p><b>Location</b><br>{{location}}</p>
      {{reserve}}
      <p></p>
      <a class="btn ghost dk" href="contact.html#form">Contact Our Team</a>
    </aside>
  </div>
</section>
<section class="alt">
  <div class="wrap">
    <div class="sh rv"><h2>Gallery</h2></div>
    <div class="grid3">{{gallery}}</div>
  </div>
</section>
